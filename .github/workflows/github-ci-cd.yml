name: Java CI with Maven

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  lab02:
    name: LAB02 — schema DatabaseSchemaTest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run LAB02 tests
        run: mvn -B test -Dtest=DatabaseSchemaTest -DfailIfNoTests=false --file pom.xml

      - name: Publish LAB02 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-lab02
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  lab03-entities:
    name: LAB03-1 — entities Lab03EntitiesTest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run LAB03-1 tests
        run: mvn -B test -Dtest=Lab03EntitiesTest -DfailIfNoTests=false --file pom.xml

      - name: Publish LAB03-1 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-lab03-entities
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  user-api:
    name: User API — UserApiIntegrationTest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run User API integration tests
        run: mvn -B test -Dtest=UserApiIntegrationTest --file pom.xml

      - name: Publish User API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-user-api
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  all-tests:
    name: All tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run all tests
        run: mvn -B test --file pom.xml

      - name: Publish all test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-all-tests
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package JAR
    runs-on: ubuntu-latest
    needs: [ lab02, lab03-entities, user-api, all-tests ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build JAR
        run: mvn -B -DskipTests package --file pom.xml

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: target/*.jar
          if-no-files-found: ignore
          retention-days: 7